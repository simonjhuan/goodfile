workflows:
  ios-workflow:
    name: goodfile iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: goodfile_appstore_api_key
    environment:
      groups:
        - code_signing
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.simonjhuan.goodfile"
      xcode: latest
      node: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Initialize keychain
        script: keychain initialize
      - name: Debug certificate key (prints no secret data)
        script: |
          echo "CERTIFICATE_PRIVATE_KEY length: ${#CERTIFICATE_PRIVATE_KEY}"
          echo "First 20 chars: $(echo "$CERTIFICATE_PRIVATE_KEY" | cut -c1-20)"
          echo "Last 20 chars: $(echo "$CERTIFICATE_PRIVATE_KEY" | tail -c 21)"
          echo "Line count: $(echo "$CERTIFICATE_PRIVATE_KEY" | wc -l)"
      - name: Fetch signing files
        script: app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $(dirname "$XCODE_PROJECT")
          agvtool new-version -all $BUILD_NUMBER
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app.dSYM
    publishing:
      email:
        recipients:
          - maew0009@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - TestMe
